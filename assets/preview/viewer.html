<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6, user-scalable=yes">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --border: #ddd; --surface: #f6f6f6; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans CJK SC", sans-serif; }
  body { -webkit-tap-highlight-color: transparent; }
  #root { padding: 12px; }
  .page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 0 0 1px var(--border); }
  .page canvas { display: block; width: 100%; height: 100%; }
  #indicator { position: fixed; right: 12px; bottom: 12px; padding: 2px 10px; border-radius: 999px;
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    font: 12px/20px system-ui, sans-serif; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #indicator.on { opacity: 1; }

  /* docx-preview: white pages on the app background, scaled to the width. */
  #root.docx { padding: 12px 0; }
  #root.docx .docx-wrapper { background: transparent; padding: 0; }
  #root.docx .docx-wrapper > section.docx { margin: 0 auto 12px; box-shadow: 0 0 0 1px var(--border); }

  /* pptx-preview: slides stacked, scaled to the width. */
  #root.pptx .pptx-preview-wrapper { background: transparent !important; overflow: visible !important; height: auto !important; }
  #root.pptx .pptx-preview-slide-wrapper { margin: 0 auto 12px !important; box-shadow: 0 0 0 1px var(--border); }

  /* SheetJS: one table per sheet, sheet tabs at the bottom. */
  #root.xlsx { padding: 0 0 44px; }
  .sheet { overflow: auto; }
  .sheet table { border-collapse: collapse; font-size: 13px; }
  .sheet td, .sheet th { border: 1px solid var(--border); padding: 3px 6px; white-space: pre; vertical-align: top; }
  .sheet .rh, .sheet .ch { background: var(--surface); color: var(--muted); text-align: center; font-weight: normal;
    position: sticky; z-index: 1; }
  .sheet .ch { top: 0; }
  .sheet .rh { left: 0; }
  .sheet .corner { position: sticky; left: 0; top: 0; z-index: 2; background: var(--surface); }
  .sheet .empty { color: var(--muted); padding: 16px; }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; overflow-x: auto; padding: 6px 8px;
    background: var(--surface); border-top: 1px solid var(--border); }
  #tabs button { flex: none; border: 1px solid transparent; background: transparent; color: var(--muted);
    border-radius: 6px; padding: 4px 10px; font: 13px system-ui, sans-serif; }
  #tabs button.on { background: var(--bg); color: var(--fg); border-color: var(--border); }
</style>
</head>
<body>
<div id="root"></div>
<div id="indicator"></div>
<script src="jszip.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
