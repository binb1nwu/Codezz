name: codezz
description: >-
  Codezz - multi-device mobile client for ZCode. Link several ZCode desktops
  through their remote-control links and drive their tasks and conversations.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  web_socket_channel: ^3.0.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.4.0
  http: ^1.6.0
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.0
  xterm: ^4.0.0
  file_picker: ^13.1.0
  video_player: ^2.14.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#161616"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#161616"
    theme_color: "#161616"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/preview/
    - assets/preview/cmaps/
